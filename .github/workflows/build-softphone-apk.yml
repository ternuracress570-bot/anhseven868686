name: Build Softphone APK

on:
  push:
    branches: [main, master]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'softphone/**'
      - '.github/workflows/build-softphone-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Ensure Gradle wrapper jar
        run: |
          mkdir -p $GITHUB_WORKSPACE/softphone/android/gradle/wrapper
          if [ ! -f $GITHUB_WORKSPACE/softphone/android/gradle/wrapper/gradle-wrapper.jar ]; then
            curl -fsSL -o $GITHUB_WORKSPACE/softphone/android/gradle/wrapper/gradle-wrapper.jar \
              https://raw.githubusercontent.com/gradle/gradle/v8.0.1/gradle/wrapper/gradle-wrapper.jar
          fi

      - name: Build Release APK
        run: |
          cd $GITHUB_WORKSPACE/softphone/android
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-softphone.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo '## Gradle Build Output (last 80 lines)' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -80 /tmp/gradle-softphone.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '## Gradle Error Extract' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -nE 'FAILURE:|What went wrong:|Execution failed|Could not resolve|Manifest merger failed|minSdkVersion|A problem occurred|BUILD FAILED' /tmp/gradle-softphone.log | tail -120 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "=== LAST 80 LINES OF GRADLE LOG ==="
          tail -80 /tmp/gradle-softphone.log
          exit $BUILD_EXIT
        env:
          GRADLE_OPTS: "-Xmx4096m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"
          JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: softphone-gradle-log
          path: /tmp/gradle-softphone.log
          retention-days: 3

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SipPhone1001-release
          path: softphone/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
